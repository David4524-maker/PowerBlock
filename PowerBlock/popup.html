<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>🛡️ PowerBlock</h1>
    <label class="switch" title="Activar / Desactivar">
      <input type="checkbox" id="toggle" />
      <span class="slider"></span>
    </label>
  </header>

  <section class="stats">
    <div class="stat">
      <span class="number" id="blocked">0</span>
      <span class="label">Anuncios bloqueados</span>
    </div>
    <button id="reset" class="ghost">Reset</button>
  </section>

  <section class="filters">
    <h2>Filtros personalizados</h2>
    <div class="row">
      <input type="text" id="newFilter" placeholder="Ej: ||ads.example.com^" />
      <button id="addFilter">Añadir</button>
    </div>
    <ul id="filterList"></ul>
  </section>

  <footer>
    <p>Estado: <strong id="status">Activo</strong></p>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
